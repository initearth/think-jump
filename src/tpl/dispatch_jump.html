<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{if $code == 1}操作成功{else /}操作失败{/if}</title>
    <style>
        :root {
            --success: #16a34a;
            --success-bg: #dcfce7;
            --error: #dc2626;
            --error-bg: #fee2e2;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --brand: #2563eb;
        }

        * { box-sizing: border-box; padding: 0; margin: 0; }

        [hidden] { display: none !important; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            padding: calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
            color: var(--ink);
            font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft Yahei", "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 40px 36px 32px;
            text-align: center;
            background: #fff;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .icon svg { width: 36px; height: 36px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

        .icon-success { color: var(--success); background: var(--success-bg); }
        .icon-success svg { stroke: var(--success); }

        .icon-error { color: var(--error); background: var(--error-bg); }
        .icon-error svg { stroke: var(--error); }

        h1 { margin-bottom: 8px; font-size: 24px; font-weight: 650; letter-spacing: 0.02em; }

        .message {
            margin-bottom: 24px;
            color: var(--muted);
            font-size: 16px;
            overflow-wrap: anywhere;
        }

        .jump { display: block; }

        .tip { margin-bottom: 10px; color: var(--muted); font-size: 14px; }

        .tip a {
            display: inline-block;
            margin: -6px -8px -6px 4px;
            padding: 6px 8px;
            color: var(--brand);
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
        }

        .tip a:hover { text-decoration: underline; }

        #wait { color: var(--ink); font-weight: 700; }

        .bar {
            height: 4px;
            overflow: hidden;
            background: var(--line);
            border-radius: 999px;
        }

        .bar span {
            display: block;
            width: 0;
            height: 100%;
            background: var(--brand);
            border-radius: inherit;
            transition: width 1s linear;
        }

        @media (prefers-reduced-motion: reduce) {
            .bar span { transition: none; }
        }

        @media (max-width: 420px) {
            body {
                padding: 16px 12px;
                padding: calc(16px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
            }

            .card { padding: 28px 20px 24px; border-radius: 16px; }
            .icon { width: 60px; height: 60px; margin-bottom: 14px; }
            .icon svg { width: 30px; height: 30px; }
            h1 { font-size: 21px; }
            .message { margin-bottom: 20px; font-size: 15px; }
            .tip { font-size: 13px; }
        }

        @media (max-height: 520px) {
            body { align-items: flex-start; }
            .card { padding-top: 20px; padding-bottom: 20px; }
            .icon { width: 52px; height: 52px; margin-bottom: 10px; }
            .icon svg { width: 28px; height: 28px; }
            h1 { font-size: 20px; }
            .message { margin-bottom: 16px; }
        }
    </style>
</head>
<body>
    <main class="card">
        {if $code == 1}
        <div class="icon icon-success" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"></path></svg>
        </div>
        <h1>操作成功</h1>
        {else /}
        <div class="icon icon-error" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </div>
        <h1>操作失败</h1>
        {/if}

        <p class="message" role="status" aria-live="polite">{$msg}</p>

        <div class="jump" id="jump">
            <p class="tip">
                <span id="wait">{$wait}</span> 秒后自动跳转，
                <a id="href" href="{$url}"{if $back} data-back="1"{/if}>{if $back}返回上一页{else /}立即跳转{/if}</a>
            </p>
            <div class="bar" aria-hidden="true"><span id="bar-inner"></span></div>
        </div>
    </main>

    <script>
        (function () {
            var jumpBox = document.getElementById('jump');
            var waitEl = document.getElementById('wait');
            var link = document.getElementById('href');
            var fill = document.getElementById('bar-inner');
            var back = link.getAttribute('data-back') === '1';
            var rawHref = link.getAttribute('href') || '';
            var remaining = parseInt(waitEl.textContent, 10);
            var timer;

            if (!back && rawHref === '') {
                jumpBox.hidden = true;
                return;
            }

            if (isNaN(remaining) || remaining < 0) {
                remaining = 0;
            }

            var total = remaining > 0 ? remaining : 1;
            waitEl.textContent = remaining;
            fill.style.width = '0%';

            function updateProgress() {
                var percent = ((total - remaining) / total) * 100;
                fill.style.width = Math.min(100, Math.max(0, percent)) + '%';
            }

            function jump() {
                if (back) {
                    history.back();
                } else {
                    window.location.assign(link.href);
                }
            }

            link.addEventListener('click', function (event) {
                event.preventDefault();
                clearInterval(timer);
                jump();
            });

            if (remaining === 0) {
                updateProgress();
                jump();
                return;
            }

            timer = setInterval(function () {
                remaining -= 1;
                waitEl.textContent = remaining;
                updateProgress();

                if (remaining <= 0) {
                    clearInterval(timer);
                    jump();
                }
            }, 1000);
        })();
    </script>
</body>
</html>
